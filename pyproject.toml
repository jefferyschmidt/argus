[project]
name = "argus"
version = "0.1.0"
description = "Personal local-first AI assistant with tiered LLM routing and layered memory"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "ollama>=0.4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "chromadb>=0.5.20",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0.3",
    "piper-tts>=1.2.0",
    "openwakeword>=0.6.0",
    "sounddevice>=0.5.1",
    "numpy>=2.1.0",
]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
argus = "argus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
