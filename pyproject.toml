[project]
name = "argus"
version = "0.1.0"
description = "Personal local-first AI assistant with tiered LLM routing and layered memory"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "ollama>=0.4.0",
    "groq>=0.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "chromadb>=0.5.20",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "pywinauto>=0.6.9",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.10.0",
    "cryptography>=42.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
voice = [
    "faster-whisper>=1.0.3",
    "piper-tts>=1.2.0",
    "openwakeword>=0.6.0",
    "sounddevice>=0.5.1",
    "numpy>=2.1.0",
    "cartesia>=2.0.0",
    "silero-vad>=6.0.0",
    "websockets>=15.0",
]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
argus = "argus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Without this, pytest's default rootdir-recursive collection walks into
# Grunge/ (a separate, unrelated project dropped into this directory so
# Argus could read/discuss it -- gitignored, but gitignore doesn't stop
# other tools from scanning the filesystem) and tries to collect its
# bundled PyInstaller build's internal torch test files. Those carry their
# own python311.dll targeting a different Python version than this
# project's 3.13 venv -- loading it mid-collection poisoned the whole
# process, breaking even unrelated stdlib imports (sqlite3) for the rest
# of the run. Scoping collection to tests/ avoids ever touching Grunge/ at
# all, not just working around the DLL conflict after the fact.
testpaths = ["tests"]
